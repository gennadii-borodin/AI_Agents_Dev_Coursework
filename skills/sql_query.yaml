name: sql_query
version: "1.0"
description: |
  Skill для выполнения SQL-запросов к базе данных PostgreSQL.
  Используется агентами для получения структурированных данных
  о требованиях, тест-кейсах и их взаимосвязях.

input_schema:
  query: string

output_schema:
  results: list
  row_count: int
  error: optional[string]
