name: rag_search
version: "1.0"
description: |
  Skill для поиска релевантной информации через векторный поиск в pgvector.
  Используется агентами для нахождения связанных требований и тест-кейсов.

input_schema:
  collection: string
  query: string
  top_k: optional[int]

output_schema:
  results: list
